# Enregistre les niveaux du Rhin et les prix quatre fois par jour, gratuitement, sur les serveurs de GitHub.
# But : garder l'historique que PEGELONLINE efface au bout d'un mois (pour les rejeux et le recalage).
name: Collecte des données

on:
  schedule:
    - cron: "17 4,10,16,22 * * *"   # heures UTC, soit 5 h 17, 11 h 17, 17 h 17 et 23 h 17 à Paris en hiver
  workflow_dispatch: {}              # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m kaub collecter
      - name: Enregistrer les nouvelles données dans le dépôt
        run: |
          git config user.name "kaub-collecte"
          git config user.email "kaub-collecte@users.noreply.github.com"
          git add data/historique
          git diff --cached --quiet || git commit -m "Collecte du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
